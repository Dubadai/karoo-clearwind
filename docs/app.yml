# One source for the README (top block) and the Reddit post: edit here, then run setup/docs.sh.
# headline: "path | alt text", light first, then dark. Text in our plain voice; no real names.
name: ClearWind
apk: clearwind.apk
intro: |
  A data field for the Hammerhead Karoo 3 that shows the wind turned to the way you ride, built to be
  read at a glance.
headline:
  - docs/images/clearwind-light.gif | ClearWind on three Karoo 3s during a ride (full page, half page, a quarter): the arrow turns as the road bends, from tailwind to headwind and back, coloured by wind speed, with the wind and gusts in m/s
  - docs/images/clearwind-dark.jpg | The same in dark mode, at one moment of the ride
features:
  - **Arrow:** points the way the wind blows (up = tailwind, down = headwind), as big as the field allows.
  - **Header like the Karoo's own fields:** wind icon left, average wind and gusts right, like yr.no (`5.2 (9) M/S`).
  - **Arrow colour:** by wind speed (green → red), black/white, or Karoo green, picked in Settings.
  - **Tile colour (optional):** the whole field tinted by wind strength in the Karoo's zone colours, text and arrow kept black/white (WCAG AAA contrast).
  - **Settings in the Karoo's app list:** wind speed in knots, m/s, km/h or mph, tile colour, arrow colour, and show gusts on or off.
  - **Long-press the field** to swap it for another, like any Karoo field.
  - **Remote button actions:** switch units and switch arrow colour.
more: |
  Wind comes from Open-Meteo (free, no API key) for your location, every 10 minutes or after 5 km (average wind at 10 m and the past hour's strongest gust),
  fetched through the Karoo's Wi-Fi or the Hammerhead phone app; your position is rounded to about
  1 km. Heading comes from the Karoo. Every build shows only real data: wind from Open-Meteo, heading from the Karoo.

  More in the [rider guide](docs/guide/README.md).

  Building it yourself or making a release: see [docs/DEVELOPING.md](docs/DEVELOPING.md).
install:
  - On your phone, open the [latest release](https://github.com/Dubadai/karoo-clearwind/releases/latest)
      and share `clearwind.apk` to the **Hammerhead Companion** app (or with a computer: `adb install clearwind.apk`).
  - In a ride profile, add **DDB ClearWind → ClearWind** to a page, at any size.
  - Open **DDB ClearWind** from the app list to pick the units, tile colour and arrow colour.
reddit:
  title: |
    ClearWind: a wind arrow data field for the Karoo 3
  body: |
    I kept checking the wind on my phone before rides and still had no idea which way it was blowing once I'd turned a few corners. So I made a data field for it.

    ClearWind shows an arrow for the wind relative to the way you're riding. Up is a tailwind, down is a headwind. The wind speed sits in the corner like on the Karoo's own fields.

    - Works in any field size, the arrow grows to fit
    - Arrow coloured by wind speed, plain black/white, or Karoo green
    - Knots, m/s, km/h or mph
    - Remote button actions to switch units or colour mid-ride
    - Wind data comes from Open-Meteo, which needs no account or API key

    It's free and open source. Download `clearwind.apk` from the latest release and sideload it, then add DDB ClearWind to a ride page.
  closing: Feedback welcome, here or on GitHub.
